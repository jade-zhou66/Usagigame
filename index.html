#pause{pointer-events:auto;border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;background:#f8d377;color:#694520;box-shadow:inset 0 -2px 0 #ddb363}
.pause-icon{display:block;width:14px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor}
button:focus-visible,canvas:focus-visible{outline:3px solid #965524;outline-offset:-3px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#61401144;padding:16px;z-index:2}
[hidden]{display:none!important}.panel{width:min(300px,100%);max-height:100%;overflow:auto;text-align:center;border:1px solid #efc476;border-radius:24px;padding:22px 20px;background:#fff7dd;box-shadow:0 8px 26px #78482126}
.panel h1,.panel h2{margin:0;font-size:24px}.panel p{margin:9px 0 14px}.actions{display:flex;justify-content:center;gap:8px;margin-top:16px}
.panel button{border-radius:24px;border:1px solid #d4aa64;padding:9px 16px;color:#6a411b;background:#ffe9b4;font-weight:700}.panel .primary{background:#855328;color:#fff9e9;border-color:#855328}
#collection{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}#collection img{width:100%;height:auto;opacity:.32}#collection img.found{opacity:1}
#prize{width:min(44vw,160px);height:auto}#help{font-size:14px;color:#815e38}
#fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#end .panel{position:relative}
#fireworks i{position:absolute;width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor;opacity:0;animation:burst .95s ease-out both}
@keyframes burst{0%{opacity:0;transform:scale(.5)}8%{opacity:1}72%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 12px)) scale(.4)}}
@media(prefers-reduced-motion:reduce){#fireworks{display:none}}
</style>
</head>

const radii = tiers.map((_, level) => {
  const t = level / (tiers.length - 1);
  // Diameter increases from 7% to 30% of the board, with smaller steps near the end.
  return width * (0.07 + 0.23 * t * (1.45 - 0.45 * t)) / 2;
});
const sprites = tiers.map(({file, name}) => {
  const sprite = new Image();
  sprite.src = file;
  sprite.alt = name;
  sprite.title = name;
  get("collection").append(sprite.cloneNode());
  return sprite;
});

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const randomLevel = () => {
  // Mix the opening four photos back in once the sixth tier is unlocked.
  if (highestLevel >= 5) {
    if (Math.random() < 0.30) return Math.floor(Math.random() * 4);
    const top = Math.min(highestLevel, tiers.length - 4);
    if (highestLevel < 8) return top - Math.floor(Math.random() * 4);
    const roll = Math.random();
    if (roll < 0.17) return top;
    if (roll < 0.42) return top - 1;
    if (roll < 0.71) return top - 2;
    return top - 3;
  }
  const choice = Math.random();
  return choice < 0.46 ? 0 : choice < 0.77 ? 1 : choice < 0.94 ? 2 : 3;
};

let audioContext;

function activateAudio() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    if (!audioContext) audioContext = new Audio();
    if (audioContext.state !== "running") audioContext.resume().catch(() => {});
  } catch {}
}

function tone(start, duration, from, to, volume, type) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(from, start);
  oscillator.frequency.exponentialRampToValueAtTime(to, start + duration);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.onended = () => {
    oscillator.disconnect();
    gain.disconnect();
  };
  oscillator.start(start);
  oscillator.stop(start + duration);
}

function playLanding() {
  if (audioContext?.state !== "running") return;
  tone(audioContext.currentTime, 0.115, 385, 145, 0.13, "sine");
}

function playMerge() {
  if (audioContext?.state !== "running") return;
  const start = audioContext.currentTime;
  tone(start, 0.105, 620, 675, 0.105, "triangle");
  tone(start + 0.075, 0.19, 890, 1010, 0.115, "sine");
}

let applause;
function playApplause() {
  if (audioContext?.state !== "running") return;
  const rate = audioContext.sampleRate;
  const buffer = audioContext.createBuffer(2, Math.ceil(rate * 2.6), rate);
  // Scatter short handclaps across several listeners, with a softer reflected tap.
  for (let listener = 0; listener < 8; listener++) {
    const pan = Math.random();
    const period = 0.19 + Math.random() * 0.12;
    for (let t = Math.random() * 0.25; t < 2.35; t += period * (0.85 + Math.random() * 0.3)) {
      const start = Math.floor(t * rate);
      const strength = (0.09 + Math.random() * 0.08) * Math.min(1, (2.45 - t) / 0.55);
      let low = 0, smooth = 0;
      const left = buffer.getChannelData(0), right = buffer.getChannelData(1);
      const echo = Math.round(rate * 0.027);
      for (let i = 0; i < rate * 0.085; i++) {
        const time = i / rate;
        const noise = 2 * Math.random() - 1;
        smooth += 0.55 * (noise - smooth);
        low += 0.12 * (smooth - low);
        const hit = strength * (smooth - low) * Math.exp(-time * 65);
        left[start + i] += hit * (1 - 0.55 * pan);
        right[start + i] += hit * (0.45 + 0.55 * pan);
        left[start + i + echo] += hit * 0.17;
        right[start + i + echo] += hit * 0.17;
      }
    }
  }
  const source = audioContext.createBufferSource();
  applause = source;
  source.buffer = buffer;
  source.connect(audioContext.destination);
  source.onended = () => {
    source.disconnect();
    if (applause === source) applause = null;
  };
  source.start();
}

function celebrate() {
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const fireworks = get("fireworks");
    const bursts = [[20, 23], [83, 29], [11, 59], [87, 67], [32, 16], [68, 81], [77, 19]];
    const colors = ["#ffd25d", "#f98693", "#a3e6eb", "#c7a9ff", "#fff4cc"];
    bursts.forEach(([x, y], index) => {
      for (let ray = 0; ray < 18; ray++) {
        const spark = document.createElement("i");
        const angle = ray * Math.PI / 9 + index;
        const distance = 36 + Math.random() * 37;
        spark.style.left = x + "%";
        spark.style.top = y + "%";
        spark.style.color = colors[(ray + index) % colors.length];
        spark.style.setProperty("--dx", Math.cos(angle) * distance + "px");
        spark.style.setProperty("--dy", Math.sin(angle) * distance + "px");
        spark.style.animationDelay = index * 0.3 + "s";
        fireworks.append(spark);
      }
    });
  }
  playApplause();
}

function reset() {
  get("fireworks").replaceChildren();
  if (applause) { applause.stop(); applause = null; }
  bodies = []; effects = []; x = width / 2; current = 0; next = 0;
  points = 0; highestLevel = 0; nextDrop = 0; danger = 0; finished = false;
  get("score").value = 0;
  get("end").hidden = true;
  paused = false;
  pendingDrop = null;
  get("menu").hidden = true;
  get("pause").hidden = false;
  collection.forEach((image, level) => image.classList.toggle("found", level === 0));
}
reset();

function resize() {
  const rect = canvas.getBoundingClientRect();
  const oldHeight = height;
  height = rect.height * width / Math.max(1, rect.width);
  const ratio = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  bodies.forEach(body => { body.y += height - oldHeight; });
}
new ResizeObserver(resize).observe(canvas);
resize();

function releasePhoto() {
  if (paused || finished) return;
  activateAudio();
  const now = performance.now();
  pendingDrop = { x, expires: now + 260 };
  drop(now);
}

function drop(now) {
  if (!pendingDrop || now < nextDrop) return;
  if (now > pendingDrop.expires) {
    pendingDrop = null;
    return;
  }
  const dropX = pendingDrop.x;
  const radius = radii[current];
  const spawnY = spawnHeight(radius);
  if (bodies.some(body => Math.hypot(body.x - dropX, body.y - spawnY) < body.r + radius - 2)) return;
  bodies.push({ x: dropX, y: spawnY, vx: 0, vy: 110, r: radius, level: current, age: 0 });
  pendingDrop = null;
  current = next;
  next = randomLevel();
  x = clamp(x, radii[current], width - radii[current]);
  nextDrop = now + 140;
}

function aim(event) {
  const rect = canvas.getBoundingClientRect();
  const radius = radii[current];
  x = clamp((event.clientX - rect.left) * width / rect.width, radius, width - radius);
}
canvas.addEventListener("pointerdown", event => {
  if (paused || finished || !event.isPrimary || event.button !== 0) return;
  activateAudio();
  canvas.setPointerCapture(event.pointerId);
  aim(event);
});
canvas.addEventListener("pointermove", event => {
  if (event.isPrimary && (event.pointerType === "mouse" || canvas.hasPointerCapture(event.pointerId))) aim(event);
});
canvas.addEventListener("pointerup", event => {
  if (!canvas.hasPointerCapture(event.pointerId)) return;
  aim(event);
  releasePhoto();
});
canvas.addEventListener("keydown", event => {
  if (paused || finished) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    const step = event.key === "ArrowLeft" ? -14 : 14;
    x = clamp(x + step, radii[current], width - radii[current]);
  } else if (event.key === " " || event.key === "Enter") {
    if (!event.repeat) releasePhoto();
  } else return;
  event.preventDefault();
});
get("pause").onclick = () => {
  if (finished) return;
  paused = true;
  pendingDrop = null;
  get("menu").hidden = false;
  get("resume").focus();
};
get("resume").onclick = () => {
  paused = false;
  get("menu").hidden = true;
  canvas.focus();
};
get("reset").onclick = () => { reset(); canvas.focus(); };
get("again").onclick = () => { reset(); canvas.focus(); };

function addPoints(amount) {
  points += amount;
  get("score").value = points;
  if (points <= best) return;
  best = points;
  get("best").value = best;
  try { localStorage.setItem(storageKey, String(best)); } catch {}
}

function endGame(won) {
  finished = true;
  pendingDrop = null;
  get("pause").hidden = true;
  if (won) get("prize").src = sprites[tiers.length - 1].src;
  get("prize").hidden = !won;
  get("end-title").textContent = won ? "合出举手乌萨奇啦！" : "圆圈堆满啦";
  get("end-score").textContent = "本局得分 " + points;
  get("end").hidden = false;
  get("again").focus();
  if (won) celebrate();
}

function confine(body) {
  if (body.x < body.r || body.x > width - body.r) {
    body.x = clamp(body.x, body.r, width - body.r);
    body.vx *= -0.31;
  }
  if (body.y > height - body.r) {
    if (!body.hasLanded) {
      body.hasLanded = true;
      playLanding();
    }
    body.y = height - body.r;
    body.vy = body.vy > 40 ? body.vy * -0.23 : 0;
    body.vx *= 0.88;
  }
}

function merge(a, b, i, j) {
  const level = a.level + 1;
  const radius = radii[level];
  const px = clamp((a.x + b.x) / 2, radius, width - radius);
  const py = Math.min(height - radius, (a.y + b.y) / 2);
  bodies.splice(j, 1);
  bodies.splice(i, 1, { x: px, y: py, vx: (a.vx + b.vx) * 0.24, vy: -28, r: radius, level, age: 0.75 });
  highestLevel = Math.max(highestLevel, level);
  for (let n = 0; n <= highestLevel; n++) collection[n].classList.add("found");
  effects.push({ x: px, y: py, r: radius, t: 0, color: tiers[level].color });
  playMerge();
  addPoints(5 * level - 1);
  if (level === radii.length - 1) endGame(true);
}

function collide(a, b, i, j) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const separation = a.r + b.r;
  const distanceSquared = dx * dx + dy * dy;
  if (distanceSquared >= separation * separation) return false;
  const distance = Math.sqrt(distanceSquared);
  const overlap = separation - distance;
  if (a.level === b.level && a.level < radii.length - 1) {
    merge(a, b, i, j);
    return true;
  }
  const nx = distance > 0.001 ? dx / distance : 1;
  const ny = distance > 0.001 ? dy / distance : 0;
  const aShare = b.r ** 2 / (a.r ** 2 + b.r ** 2);
  const bShare = 1 - aShare;
  a.x -= nx * overlap * aShare;
  a.y -= ny * overlap * aShare;
  b.x += nx * overlap * bShare;
  b.y += ny * overlap * bShare;
  const speed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (speed < 0) {
    const bump = speed < -55 ? speed * 1.16 : speed;
    a.vx += nx * bump * aShare;
    a.vy += ny * bump * aShare;
    b.vx -= nx * bump * bShare;
    b.vy -= ny * bump * bShare;
  }
  return false;
}

function step(dt) {
  if (finished || paused) return;
  for (const body of bodies) {
    body.age += dt;
    body.vy = Math.min(820, body.vy + 975 * dt);
    body.vx *= 0.998;
    body.x += body.vx * dt;
    body.y += body.vy * dt;
    confine(body);
  }
  for (let pass = 0; pass < 4 && !finished; pass++) {
    for (let i = 0; i < bodies.length && !finished; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        if (collide(bodies[i], bodies[j], i, j)) break;
      }
    }
    bodies.forEach(confine);
  }
  const crowded = bodies.some(body => body.age > 0.9 && body.y - body.r < limit && Math.abs(body.vy) < 100);
  danger = crowded ? danger + dt : Math.max(0, danger - dt * 1.5);
  if (danger > 1.2 && !finished) endGame(false);
}

function disc(px, py, radius, level) {
  ctx.beginPath(); ctx.arc(px, py, radius - 0.3, 0, Math.PI * 2);
  ctx.fillStyle = tiers[level].color; ctx.fill();
  if (sprites[level].complete && sprites[level].naturalWidth) {
    ctx.drawImage(sprites[level], px - radius, py - radius, radius * 2, radius * 2);
  }
  ctx.strokeStyle = "#694d842e"; ctx.lineWidth = 1; ctx.stroke();
}

function draw(dt, now) {
  ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
  ctx.clearRect(0, 0, width, height);
  for (const body of bodies) disc(body.x, body.y, body.r, body.level);
  if (!finished) {
    ctx.globalAlpha = now >= nextDrop ? 1 : 0.36;
    disc(x, spawnHeight(radii[current]), radii[current], current);
    ctx.globalAlpha = 1;
  }
  for (const effect of effects) {
    effect.t += dt * 2.7;
    if (effect.t >= 1) continue;
    ctx.globalAlpha = 1 - effect.t;
    ctx.strokeStyle = effect.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(effect.x, effect.y, effect.r + effect.t * 22, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  effects = effects.filter(effect => effect.t < 1);
}

const fixedStep = 1 / 120;
let accumulator = 0;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.035, Math.max(0, (now - last) / 1000));
  last = now;
  if (!paused && !finished) {
    drop(now);
    accumulator += dt;
    while (accumulator >= fixedStep) {
      step(fixedStep);
      accumulator -= fixedStep;
    }
  } else {
    accumulator = 0;
  }
  draw(paused ? 0 : dt, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body></html>
